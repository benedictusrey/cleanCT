name: release

# Linux and the portable Python source are built here. The Linux job runs the
# regression gate and a self-check, packages the tarball, checks it in clean
# Ubuntu 22.04 and Debian 12 containers, and checks the Python source in a fresh
# venv. Windows is built on the maintainer's PC (installer and portable ZIP) and
# added to the same release by hand. macOS is not part of this release. A tag
# push (v1.0.0) or a manual run with "publish" creates a DRAFT release, and only
# after the Linux build passes. Publishing is a separate, manual step.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the draft GitHub Release (otherwise keep the files as artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read                  # the build jobs only read the repository and upload artifacts

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86_64 (portable tarball and Python source)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Qt system libraries (OpenGL/EGL, X11 xkbcommon, dbus, fontconfig)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Build the Linux package (runtime, gate, self-check, tarball)
        run: python3 installer/build_posix.py linux-x86_64

      - name: Check the package in clean Ubuntu 22.04 and Debian 12 containers
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'installer'); import build_installer; print(build_installer.APP_VERSION)")
          archive="cleanCT-${version}-linux-x86_64.tar.gz"
          for image in ubuntu:22.04 debian:12; do
            echo "== $image"
            docker run --rm -e QT_QPA_PLATFORM=offscreen \
              -v "$GITHUB_WORKSPACE/installer/out:/pkg:ro" "$image" \
              sh -c "apt-get update -qq && apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1 libglib2.0-0 >/dev/null && tar -xzf /pkg/$archive -C /tmp && /tmp/cleanCT-${version}-linux-x86_64/cleanCT --selfcheck"
          done

      - name: Build the Python source and check it in a fresh venv
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'installer'); import build_installer; print(build_installer.APP_VERSION)")
          name="cleanCT-${version}-python-source"
          git archive --format=zip --prefix="$name/" -o "installer/out/$name.zip" HEAD
          (cd installer/out && sha256sum "$name.zip" > "$name.zip.sha256")
          work=$(mktemp -d)
          python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "installer/out/$name.zip" "$work"
          python3 -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install -q -r "$work/$name/installer/requirements-core.txt"
          cd "$work/$name"
          QT_QPA_PLATFORM=offscreen "$work/venv/bin/python" main.py --selfcheck

      - name: Upload the Linux and Python source files
        uses: actions/upload-artifact@v4
        with:
          name: cleanCT-linux-x86_64
          path: |
            installer/out/cleanCT-*-linux-x86_64.tar.gz
            installer/out/cleanCT-*-linux-x86_64.tar.gz.sha256
            installer/out/cleanCT-*-python-source.zip
            installer/out/cleanCT-*-python-source.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create the draft GitHub Release
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write             # only this job creates the release
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the Linux and Python source builds
        uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Check the tag and the files, then create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'installer'); import build_installer; print(build_installer.APP_VERSION)")
          tag="v${version}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match APP_VERSION $version"; exit 1
          fi
          cd files
          for f in "cleanCT-${version}-linux-x86_64.tar.gz" \
                   "cleanCT-${version}-python-source.zip"; do
            if [ ! -f "$f" ]; then echo "missing $f"; exit 1; fi
          done
          sha256sum * > SHA256SUMS
          gh release create "$tag" * --draft --title "cleanCT ${version}" \
            --notes-file "$GITHUB_WORKSPACE/docs/RELEASE_NOTES.md" --target "$GITHUB_SHA"
