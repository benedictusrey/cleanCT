name: release

# Linux and macOS are built here: a portable tarball, and a DMG for Apple silicon
# and for Intel. Each build runs the regression gate and a self-check before it
# packages. Windows is built on the maintainer's PC (installer and portable ZIP)
# and added to the same release by hand, so the Windows job below is optional.
# A tag push (v1.0.0) or a manual run with "publish" creates a DRAFT release, and
# only after both platform builds pass. Publishing is a separate, manual step.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the draft GitHub Release (otherwise keep the files as artifacts only)"
        type: boolean
        default: false
      include_windows:
        description: "Also build the Windows files in CI (normally built on the maintainer's PC)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 (optional CI build)
    if: inputs.include_windows
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress --limit-output

      - name: Build the pinned environment and PyInstaller
        shell: pwsh
        run: |
          python -m venv tests\venv_notorch
          & .\installer\setup_env.ps1 .\tests\venv_notorch\Scripts\python.exe
          if ($LASTEXITCODE -ne 0) { throw "setup_env.ps1 failed" }
          python -m pip install "pyinstaller==6.22.2"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller install failed" }

      - name: Build the release (gate, package, launcher, ZIP, installer)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          python installer\build_installer.py --iscc $iscc.FullName
          if ($LASTEXITCODE -ne 0) { throw "build_installer.py failed with exit code $LASTEXITCODE" }

      - name: Upload the Windows files
        uses: actions/upload-artifact@v4
        with:
          name: cleanCT-windows-x64
          path: |
            installer/out/cleanCT-*-portable.zip
            installer/out/cleanCT-*-portable.zip.sha256
            installer/out/cleanCT-*-setup.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x86_64 (portable tarball)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Qt system libraries (OpenGL/EGL, X11 xkbcommon, dbus, fontconfig)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Build the Linux package (runtime, gate, self-check, tarball)
        run: python3 installer/build_posix.py linux-x86_64

      - name: Check the package in clean Ubuntu 22.04 and Debian 12 containers
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'installer'); import build_installer; print(build_installer.APP_VERSION)")
          archive="cleanCT-${version}-linux-x86_64.tar.gz"
          for image in ubuntu:22.04 debian:12; do
            echo "== $image"
            docker run --rm -e QT_QPA_PLATFORM=offscreen \
              -v "$GITHUB_WORKSPACE/installer/out:/pkg:ro" "$image" \
              sh -c "apt-get update -qq && apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1 libglib2.0-0 >/dev/null && tar -xzf /pkg/$archive -C /tmp && /tmp/cleanCT-${version}-linux-x86_64/cleanCT --selfcheck"
          done

      - name: Upload the Linux files
        uses: actions/upload-artifact@v4
        with:
          name: cleanCT-linux-x86_64
          path: |
            installer/out/cleanCT-*-linux-x86_64.tar.gz
            installer/out/cleanCT-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.target }} (DMG)
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, macos-x86_64]
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rosetta 2 (runs the Intel build on Apple silicon)
        if: matrix.target == 'macos-x86_64'
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Build the macOS package (runtime, gate, self-check, DMG)
        run: python3 installer/build_posix.py ${{ matrix.target }}

      - name: Upload the macOS files
        uses: actions/upload-artifact@v4
        with:
          name: cleanCT-${{ matrix.target }}
          path: |
            installer/out/cleanCT-*-${{ matrix.target }}.dmg
            installer/out/cleanCT-*-${{ matrix.target }}.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create the draft GitHub Release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the Linux and macOS builds
        uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Check the tag and the files, then create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'installer'); import build_installer; print(build_installer.APP_VERSION)")
          tag="v${version}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match APP_VERSION $version"; exit 1
          fi
          cd files
          for f in "cleanCT-${version}-linux-x86_64.tar.gz" \
                   "cleanCT-${version}-macos-arm64.dmg" \
                   "cleanCT-${version}-macos-x86_64.dmg"; do
            if [ ! -f "$f" ]; then echo "missing $f"; exit 1; fi
          done
          sha256sum * > SHA256SUMS
          gh release create "$tag" * --draft --title "cleanCT ${version}" \
            --notes-file "$GITHUB_WORKSPACE/docs/RELEASE_NOTES.md" --target "$GITHUB_SHA"
